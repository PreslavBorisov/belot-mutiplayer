name: Build and verify Belot app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile engine and tests
        run: |
          mkdir -p /tmp/belot-classes
          javac -d /tmp/belot-classes backend/game-engine/src/main/java/bg/belot/engine/*.java backend/game-engine/src/test/java/bg/belot/engine/*.java
      - name: Run engine tests
        run: |
          java -ea -cp /tmp/belot-classes bg.belot.engine.EngineSmoke
          java -ea -cp /tmp/belot-classes bg.belot.engine.RulesRegression
          java -ea -cp /tmp/belot-classes bg.belot.engine.BotMatchRegression
          java -ea -cp /tmp/belot-classes bg.belot.engine.DeclarationRegression
          java -ea -cp /tmp/belot-classes bg.belot.engine.BeloteTimingRegression
          java -ea -cp /tmp/belot-classes bg.belot.engine.AnnouncementRegression
          java -ea -cp /tmp/belot-classes bg.belot.engine.ScoringRegression
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Maven package
        working-directory: backend
        run: mvn -B --no-transfer-progress clean verify
      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: belot-server-jar
          path: backend/game-server/target/*.jar
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build React
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: belot-frontend
          path: frontend/dist/
  docker:
    runs-on: ubuntu-latest
    needs: [game-engine, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build complete production Docker image
        run: docker build -t belot-multiplayer:ci .
